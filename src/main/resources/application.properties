server.port=${PORT:8080}
logging.level.org.atmosphere = warn

# To improve the performance during development. 
# For more information https://vaadin.com/docs/latest/integrations/spring/configuration#special-configuration-parameters
# vaadin.whitelisted-packages= org/vaadin/example
vaadin.whitelisted-packages=org/example,org/vaadin

# Used by the LocalizedFields demo (Viritin) to machine-translate field values.
# Translation stays disabled (and the "translate" button hidden) until a key is
# given. Provide one via the MISTRAL_API_KEY environment variable, e.g.
#   MISTRAL_API_KEY=xxxxx mvn spring-boot:run
# Get a free key at https://console.mistral.ai
spring.ai.mistralai.api-key=${MISTRAL_API_KEY:}